services:
  mysql_db:
    image: ccr.ccs.tencentyun.com/jxwaf/mysql:8.0
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_0900_ai_ci
      MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb_buffer_pool_size=256M
      - --max-connections=1000
    volumes:
      - /opt/jxwaf_data/standard_mysql:/var/lib/mysql

  jxwaf_admin_server:
    image: ccr.ccs.tencentyun.com/jxwaf/jxwaf_admin_server_standard:6.2.4
    restart: unless-stopped
    network_mode: host
    environment:
      HTTP_PORT: 8000
      HTTPS_PORT: 8443
      ENABLE_HTTPS: "false"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: jxwaf_admin_server
      MYSQL_USER: root
      MYSQL_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739
      JXWAF_MODEL_SERVER_HOST: model.jxwaf.com
      JXWAF_MODEL_SERVER_PORT: 39980
      JXWAF_MODEL_SERVER_SSL: "true"
      WAF_AUTH: ade1e4c0-d644-46fe-9675-5fb59b486381
      WAF_UPDATE_CONF_DATA_SIZE: "100m"
      CONF_DATA_SIZE: "100m"
      MODEL_DATA_SIZE: "100m"
    #volumes:
      #- ./ssl_certs/server.crt:/opt/jxwaf_admin_server/nginx/conf/server.crt
      #- ./ssl_certs/server.key:/opt/jxwaf_admin_server/nginx/conf/server.key
    depends_on:
      - mysql_db

  jxwaf_node_standard:
    image: "ccr.ccs.tencentyun.com/jxwaf/jxwaf_node_standard:6.2.3"
    network_mode: host
    privileged: true
    ulimits:
      nofile:
        soft: 602400
        hard: 602400
    environment:
      HTTP_PORT: 80
      HTTPS_PORT: 443
      WAF_CONF_DATA: 100m
      JXWAF_INNER: 100m
      JXWAF_USER: 100m
      JXWAF_REQUEST_COUNT: 100m
      JXWAF_REQUEST_IP: 100m
      JXWAF_REQUEST_IP_COUNT: 100m
      JXWAF_LIMIT_BOT: 100m
      RESOLVER_IPS: "223.5.5.5 119.29.29.29 114.114.114.114 1.1.1.1"
      SSL_ATTACK_STAT_SIZE: 10m
      SSL_BLACK_IP_SIZE: 10m
      SSL_ATTACK_PROTECT: "false"
      SSL_ATTACK_STAT_TIME: 60
      SSL_ATTACK_STAT_COUNT: 10000
      SSL_ATTACK_BLOCK_TIME: 600
      LOG_IP: 127.0.0.1
      LOG_PORT: 12997
      JXWAF_SERVER: http://127.0.0.1:8000
      WAF_AUTH: ade1e4c0-d644-46fe-9675-5fb59b486381
      TZ: Asia/Shanghai
    restart: unless-stopped
    #volumes:
      #- ./nginx.conf.tmpl:/opt/jxwaf/nginx/conf/nginx.conf.tmpl:ro

  log_send_to_mysql:
    image: ccr.ccs.tencentyun.com/jxwaf/log_send_to_mysql:v2
    container_name: data_send_to_mysql
    network_mode: host
    environment:
      LISTEN_ADDR: ":12997"
      BATCH_SIZE: "50"
      BATCH_WAIT_TIMEOUT: "2s"
      MAX_CONNECTIONS: "1000"
      MAX_IDLE_CONNS: "10"
      CONN_MAX_LIFETIME: "10m"
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_DATABASE: "jxwaf_admin_server"
      DB_USER: "root"
      DB_PASSWORD: "958fba75-56c6-4e81-a892-62517a9e1739"
      DB_TABLE: "jxwaf_waf_attack_log"
      DB_CHARSET: "utf8mb4"
    restart: unless-stopped
    depends_on:
      - mysql_db

  # ==================== SSL 证书自动申请服务（Let's Encrypt 泛域名证书，配合管理台证书管理功能）====================
  # 注意：依赖管理台镜像包含证书管理功能（/request_wildcard_cert 及内部 API），上线前需确认管理台镜像版本已更新
  ssl_cert_service:
    image: ccr.ccs.tencentyun.com/jxwaf/ssl_cert_service:6.2.2
    container_name: ssl_cert_service
    restart: always
    depends_on:
      - jxwaf_admin_server
    network_mode: host
    environment:
      CONSOLE_API_URL: http://127.0.0.1:8000
      POLL_INTERVAL: 60s
      RENEWAL_CHECK_INTERVAL: 6h
      RENEWAL_DAYS: 30
      ACME_DIRECTORY_URL: https://acme-v02.api.letsencrypt.org/directory
      ACME_ACCOUNT_DIR: /data/acme_accounts
      ACME_EMAIL_DOMAIN: jxwaf.com
      ACME_ACCOUNT_MODE: per_user
      TZ: Asia/Shanghai
    volumes:
      # ACME 账户持久化，避免容器重建后重复注册账号（Let's Encrypt 有每账号速率限制）
      - /opt/jxwaf_data/ssl_cert_service:/data

  jxwaf_nft_node:
    image: ccr.ccs.tencentyun.com/jxwaf/jxwaf_nft_node:7.0
    container_name: jxwaf_nft_node
    restart: always
    network_mode: host
    privileged: true
    environment:
      WAF_SERVER_URL: http://127.0.0.1:8000
      WAF_AUTH: ade1e4c0-d644-46fe-9675-5fb59b486381
      SYNC_INTERVAL: 3
      TZ: Asia/Shanghai
      WAF_FILTER_PORTS: "80,443"

  # ==================== AI 模型更新服务（可选，按需取消注释启用） ====================
  # jxwaf_model_update2:
  #   image: ccr.ccs.tencentyun.com/jxwaf/jxwaf_model_update:2.9
  #   container_name: jxwaf_model_update2
  #   restart: unless-stopped
  #   network_mode: host
  #   ulimits:
  #     nofile:
  #       soft: 602400
  #       hard: 602400
  #   environment:
  #     # ==================== 基础配置 ====================
  #     TZ: Asia/Shanghai                                          # 时区
  #     AUTH_CODE: 
  #     MYSQL_HOST: 127.0.0.1
  #     MYSQL_PORT: 3306
  #     MYSQL_USER: root
  #     MYSQL_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739
  #     MYSQL_DATABASE: jxwaf_model_update2                     # MySQL 数据库名
  #
  #     # ==================== AI 平台配置 ====================
  #     # AI 平台详细配置（JSON 格式），所有配置的平台将并行运行
  #     # 字段说明：
  #     #   api_key: API Key | api_url: 请求地址 | model: 模型名称 | temperature: 温度参数 (0-2)
  #     #   timeout: 单次请求超时（秒）| max_retries: 失败重试次数 | thinking_type: 思考模式 | stream: 是否启用流式
  #     PLATFORMS: |-
  #       {
  #           "deepseek": {
  #               "api_key": "",
  #               "api_url": "https://api.deepseek.com/chat/completions",
  #               "model": "deepseek-v4-flash",
  #               "temperature": 0.2,
  #               "timeout": 300,
  #               "max_retries": 1,
  #               "thinking_type": "disabled",
  #               "stream": false
  #           }
  #       }
  #
  #     # WAF 引擎配置（JSON 格式），所有配置的引擎将并行运行
  #     # 字段说明：
  #     #   url: WAF 引擎 POST 请求地址
  #     #   timeout: 单次请求超时（秒）
  #     #   match_type: 匹配方式，"status_code" 或 "content_contains"（互斥二选一）
  #     #   match_value: status_code 时为整数（如 403），content_contains 时为字符串（如 "blocked"）
  #     WAF_ENGINES: |-
  #        {
  #            "safeline": {
  #                "url": "https://waf-ce.demo.chaitin.cn:10084/hello.html",
  #                "timeout": 5,
  #                "match_type": "status_code",
  #                "match_value": 403
  #            }
  #        }
  #
  #     # ==================== 定时任务配置 ====================
  #     # 本地 DB 数据同步到 shared dict 的间隔（秒）
  #     SYNC_INTERVAL: "3"
  #     # 每次同步最大拉取行数
  #     SYNC_BATCH_SIZE: "5000"
  #     # AI/WAF 分析扫描间隔（秒），per engine 容量驱动增量扫描
  #     SCAN_INTERVAL: "2"
  #     # 单个 AI platform 对同一条记录连续分析 N 次，要求 N 次结果完全一致才采纳
  #     # 每个 AI platform 独立统计，不跨 platform 投票
  #     #   1 = 单次调用直接采纳（最快，无一致性校验）
  #     #   2 = 同一 platform 调用 2 次要求一致（平衡，API 成本翻倍）
  #     #   3 = 同一 platform 调用 3 次要求一致（高可信，成本 3 倍）
  #     # 例：2 个 platform + ANALYSIS_COUNT=2 → 每个 platform 各自跑 2 次要求一致，共 4 次 API 调用
  #     ANALYSIS_COUNT: "2"
  #     # 结果不一致时的重试轮数，每轮重新跑 ANALYSIS_COUNT 次
  #     # 最坏情况单条记录单 platform 最多调用 ANALYSIS_COUNT × (1 + 此值) 次 API
  #     # 如 ANALYSIS_COUNT=2 + 本项=2，最坏单 platform 2×3=6 次 API 调用
  #     ANALYSIS_CONSISTENCY_RETRIES: "2"
  #     # Review 补偿扫描间隔（秒），per engine 独立处理失败/遗漏记录
  #     REVIEW_INTERVAL: "60"
  #     # 每次 Review 扫描最大行数
  #     REVIEW_BATCH_SIZE: "1000"
  #     # processing 标记 TTL（秒），防 per record×engine 重复分析
  #     PROCESSING_TTL: "120"
  #     # cooldown 标记 TTL（秒），network_error/5xx 后短暂冷却防雪崩
  #     COOLDOWN_TTL: "60"
  #     # per engine 最大失败次数（config_error/确定性错误累计），达到后该 engine 被查询剔除
  #     MAX_FAIL_COUNT: "3"
  #     # 单 engine 最大并发任务数
  #     MAX_CONCURRENT_TASKS: "20"
  #     # 查询结果返回模式：
  #     #   any (默认) - 任一非 fail engine 完成即返回部分结果（不等其他 engine）
  #     #   all        - 所有非 fail engine 都完成才返回，否则返回 none（严格模式，多 engine 一致更可信）
  #     QUERY_RESULT_MODE: "all"
  #
  #     # ==================== Nginx / shared dict 配置 ====================
  #     MODEL_DATA_SIZE: 1000m                                       # model_data shared dict 大小（存放 AI 分析结果缓存）
  #     AI_PLATFORM_STATE_SIZE: 10m                                  # ai_platform_state shared dict 大小（平台状态）
  #     RESOLVER_IPS: 223.5.5.5 119.29.29.29 114.114.114.114        # DNS 解析器 IP（用于 HTTPS 出站请求）
  #
  #     # ==================== 调试与网络配置 ====================
  #     STREAM_PORT: "39980"                                         # 监听端口
  #     ENABLE_TLS: "false"                                          # 是否启用 TLS 加密（true 启用，需取消下方 volumes 证书挂载注释并配置证书路径）
  #
  #     # ==================== 云端模型同步配置（可选，连接远程 Model Server 拉取 AI 分析结果） ====================
  #     JXWAF_MODEL_SERVER_ENABLE: "false"                          # 是否启用云端模型同步（true 启用）
  #     JXWAF_MODEL_SERVER_HOST: "model.jxwaf.com"                   # 远程云端 Model Server 主机地址
  #     JXWAF_MODEL_SERVER_PORT: "39977"                             # 远程云端 Model Server 端口
  #     JXWAF_MODEL_SERVER_SSL: "true"                               # 是否通过 TLS 连接远程云端
  #   #volumes:
  #     #- ./ssl/server.crt:/opt/jxwaf_model_update/nginx/conf/server.crt:ro
  #     #- ./ssl/server.key:/opt/jxwaf_model_update/nginx/conf/server.key:ro

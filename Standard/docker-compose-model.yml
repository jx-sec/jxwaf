services:
  mysql_db:
    image: ccr.ccs.tencentyun.com/jxwaf/mysql:8.0
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_0900_ai_ci
      MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb_buffer_pool_size=256M
      - --max-connections=1000
    volumes:
      - /opt/jxwaf_data/standard_mysql:/var/lib/mysql

  jxwaf_admin_server:
    image: ccr.ccs.tencentyun.com/jxwaf/jxwaf_admin_server_standard:6.2.16
    restart: unless-stopped
    network_mode: host
    environment:
      HTTP_PORT: 8000
      HTTPS_PORT: 8443
      ENABLE_HTTPS: "false"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: jxwaf_admin_server
      MYSQL_USER: root
      MYSQL_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739
      JXWAF_MODEL_SERVER_HOST: 127.0.0.1
      JXWAF_MODEL_SERVER_PORT: "39980"
      JXWAF_MODEL_SERVER_SSL: "false"
      WAF_AUTH: ade1e4c0-d644-46fe-9675-5fb59b486381
      WAF_UPDATE_CONF_DATA_SIZE: "100m"
      CONF_DATA_SIZE: "100m"
      MODEL_DATA_SIZE: "100m"
      TZ: Asia/Shanghai
    #volumes:
      #- ./ssl_certs/server.crt:/opt/jxwaf_admin_server/nginx/conf/server.crt
      #- ./ssl_certs/server.key:/opt/jxwaf_admin_server/nginx/conf/server.key
    depends_on:
      - mysql_db

  jxwaf_node_standard:
    image: "ccr.ccs.tencentyun.com/jxwaf/jxwaf_node_standard:6.2.8"
    network_mode: host
    privileged: true
    ulimits:
      nofile:
        soft: 602400
        hard: 602400
    environment:
      HTTP_PORT: 80
      HTTPS_PORT: 443
      WAF_CONF_DATA: 100m
      JXWAF_INNER: 100m
      JXWAF_USER: 100m
      JXWAF_REQUEST_COUNT: 100m
      JXWAF_REQUEST_IP: 100m
      JXWAF_REQUEST_IP_COUNT: 100m
      JXWAF_LIMIT_BOT: 100m
      RESOLVER_IPS: "223.5.5.5 119.29.29.29 114.114.114.114 1.1.1.1"
      SSL_ATTACK_STAT_SIZE: 10m
      SSL_BLACK_IP_SIZE: 10m
      SSL_ATTACK_PROTECT: "false"
      SSL_ATTACK_STAT_TIME: 60
      SSL_ATTACK_STAT_COUNT: 10000
      SSL_ATTACK_BLOCK_TIME: 600
      LOG_IP: 127.0.0.1
      LOG_PORT: 12997
      JXWAF_SERVER: http://127.0.0.1:8000
      WAF_AUTH: ade1e4c0-d644-46fe-9675-5fb59b486381
      TZ: Asia/Shanghai
    restart: unless-stopped
    #volumes:
      #- ./nginx.conf.tmpl:/opt/jxwaf/nginx/conf/nginx.conf.tmpl:ro

  log_send_to_mysql:
    image: ccr.ccs.tencentyun.com/jxwaf/log_send_to_mysql:v3
    container_name: log_send_to_mysql
    network_mode: host
    environment:
      LISTEN_ADDR: ":12997"
      BATCH_SIZE: "50"
      BATCH_WAIT_TIMEOUT: "2s"
      MAX_CONNECTIONS: "1000"
      MAX_IDLE_CONNS: "10"
      CONN_MAX_LIFETIME: "10m"
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_DATABASE: "jxwaf_admin_server"
      DB_USER: "root"
      DB_PASSWORD: "958fba75-56c6-4e81-a892-62517a9e1739"
      DB_TABLE: "jxwaf_waf_attack_log"
      DB_CHARSET: "utf8mb4"
      TZ: Asia/Shanghai
    restart: unless-stopped
    depends_on:
      - mysql_db

  ssl_cert_service:
    image: ccr.ccs.tencentyun.com/jxwaf/ssl_cert_service:6.2.3
    container_name: ssl_cert_service
    restart: always
    depends_on:
      - jxwaf_admin_server
    network_mode: host
    environment:
      CONSOLE_API_URL: http://127.0.0.1:8000
      POLL_INTERVAL: 60s
      RENEWAL_CHECK_INTERVAL: 6h
      RENEWAL_DAYS: 30
      ACME_DIRECTORY_URL: https://acme-v02.api.letsencrypt.org/directory
      ACME_ACCOUNT_DIR: /data/acme_accounts
      ACME_EMAIL_DOMAIN: jxwaf.com
      ACME_ACCOUNT_MODE: per_user
      TZ: Asia/Shanghai
    volumes:
      - /opt/jxwaf_data/ssl_cert_service:/data

  jxwaf_nft_node:
    image: ccr.ccs.tencentyun.com/jxwaf/jxwaf_nft_node:7.0
    container_name: jxwaf_nft_node
    restart: always
    network_mode: host
    privileged: true
    environment:
      WAF_SERVER_URL: http://127.0.0.1:8000
      WAF_AUTH: ade1e4c0-d644-46fe-9675-5fb59b486381
      SYNC_INTERVAL: 3
      TZ: Asia/Shanghai
      WAF_FILTER_PORTS: "80,443"

  jxwaf_model_server:
    image: ccr.ccs.tencentyun.com/jxwaf/jxwaf_model_server:2.5
    container_name: jxwaf_model_server
    restart: unless-stopped
    depends_on:
      - mysql_model_db
    network_mode: host
    ulimits:
      nofile:
        soft: 602400
        hard: 602400
    environment:
      TZ: Asia/Shanghai
      MODEL_SERVER_SECRET: jxwaf
      STREAM_HOST: 0.0.0.0
      STREAM_PORT: "39980"
      ENABLE_TLS: "false"
      MAX_CONNS_PER_IP: "64"
      CACHE_CAPACITY: "1000000"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3307"
      MYSQL_USER: root
      MYSQL_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739
      MYSQL_DATABASE: jxwaf_model_server
      PLATFORMS: |-
        {
            "deepseek": {
                "api_key": "sk-xxx",
                "api_url": "https://api.deepseek.com/chat/completions",
                "model": "deepseek-flash",
                "concurrency": 20,
                "qps": 10,
                "column": "res_deepseek"
            }
        }
      WAF_ENGINES: |-
        {
            "safeline": {
                "url": "https://waf-ce.demo.chaitin.cn:10082/hello.html",
                "timeout": 5,
                "match_type": "status_code",
                "match_value": 403,
                "qps": 10,
                "column": "res_safeline",
                "refresh": {
                    "interval_hours": 24,
                    "scope": "recent",
                    "recent_days": 7,
                    "qps": 10
                }
            }
        }
    #volumes:
      #- ./ssl/server.crt:/opt/jxwaf_model_server/conf/server.crt:ro
      #- ./ssl/server.key:/opt/jxwaf_model_server/conf/server.key:ro

  mysql_model_db:
    image: ccr.ccs.tencentyun.com/jxwaf/mysql:8.0
    container_name: jxwaf_model_server_mysql
    restart: always
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_0900_ai_ci
      MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb_buffer_pool_size=256M
      - --max-connections=1000
    volumes:
      - /opt/jxwaf_data/mysql_model_server:/var/lib/mysql

services:
  mysql_db:
    image: ccr.ccs.tencentyun.com/jxwaf/mysql:8.0
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_0900_ai_ci
      MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb_buffer_pool_size=256M
      - --max-connections=1000
    volumes:
      - /opt/jxwaf_data/standard_mysql:/var/lib/mysql

  jxwaf_admin_server:
    image: ccr.ccs.tencentyun.com/jxwaf/jxwaf_admin_server_standard:6.2.24
    restart: unless-stopped
    network_mode: host
    environment:
      HTTP_PORT: 8000
      HTTPS_PORT: 8443
      ENABLE_HTTPS: "false"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: jxwaf_admin_server
      MYSQL_USER: root
      MYSQL_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739
      JXWAF_MODEL_SERVER_HOST: 127.0.0.1
      JXWAF_MODEL_SERVER_PORT: "39980"
      JXWAF_MODEL_SERVER_SSL: "false"
      WAF_AUTH: ade1e4c0-d644-46fe-9675-5fb59b486381
      WAF_UPDATE_CONF_DATA_SIZE: "100m"
      CONF_DATA_SIZE: "100m"
      MODEL_DATA_SIZE: "100m"
      TZ: Asia/Shanghai
    #volumes:
      #- ./ssl_certs/server.crt:/opt/jxwaf_admin_server/nginx/conf/server.crt
      #- ./ssl_certs/server.key:/opt/jxwaf_admin_server/nginx/conf/server.key
    depends_on:
      - mysql_db

  jxwaf_node_standard:
    image: "ccr.ccs.tencentyun.com/jxwaf/jxwaf_node_standard:6.2.8"
    network_mode: host
    privileged: true
    ulimits:
      nofile:
        soft: 602400
        hard: 602400
    environment:
      HTTP_PORT: 80
      HTTPS_PORT: 443
      WAF_CONF_DATA: 100m
      JXWAF_INNER: 100m
      JXWAF_USER: 100m
      JXWAF_REQUEST_COUNT: 100m
      JXWAF_REQUEST_IP: 100m
      JXWAF_REQUEST_IP_COUNT: 100m
      JXWAF_LIMIT_BOT: 100m
      RESOLVER_IPS: "223.5.5.5 119.29.29.29 114.114.114.114 1.1.1.1"
      SSL_ATTACK_STAT_SIZE: 10m
      SSL_BLACK_IP_SIZE: 10m
      SSL_ATTACK_PROTECT: "false"
      SSL_ATTACK_STAT_TIME: 60
      SSL_ATTACK_STAT_COUNT: 10000
      SSL_ATTACK_BLOCK_TIME: 600
      LOG_IP: 127.0.0.1
      LOG_PORT: 12997
      JXWAF_SERVER: http://127.0.0.1:8000
      WAF_AUTH: ade1e4c0-d644-46fe-9675-5fb59b486381
      TZ: Asia/Shanghai
    restart: unless-stopped
    #volumes:
      #- ./nginx.conf.tmpl:/opt/jxwaf/nginx/conf/nginx.conf.tmpl:ro

  log_send_to_mysql:
    image: ccr.ccs.tencentyun.com/jxwaf/log_send_to_mysql:v3
    container_name: log_send_to_mysql
    network_mode: host
    environment:
      LISTEN_ADDR: ":12997"
      BATCH_SIZE: "50"
      BATCH_WAIT_TIMEOUT: "2s"
      MAX_CONNECTIONS: "1000"
      MAX_IDLE_CONNS: "10"
      CONN_MAX_LIFETIME: "10m"
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_DATABASE: "jxwaf_admin_server"
      DB_USER: "root"
      DB_PASSWORD: "958fba75-56c6-4e81-a892-62517a9e1739"
      DB_TABLE: "jxwaf_waf_attack_log"
      DB_CHARSET: "utf8mb4"
      TZ: Asia/Shanghai
    restart: unless-stopped
    depends_on:
      - mysql_db

  ssl_cert_service:
    image: ccr.ccs.tencentyun.com/jxwaf/ssl_cert_service:6.2.3
    container_name: ssl_cert_service
    restart: always
    depends_on:
      - jxwaf_admin_server
    network_mode: host
    environment:
      CONSOLE_API_URL: http://127.0.0.1:8000
      POLL_INTERVAL: 60s
      RENEWAL_CHECK_INTERVAL: 6h
      RENEWAL_DAYS: 30
      ACME_DIRECTORY_URL: https://acme-v02.api.letsencrypt.org/directory
      ACME_ACCOUNT_DIR: /data/acme_accounts
      ACME_EMAIL_DOMAIN: jxwaf.com
      ACME_ACCOUNT_MODE: per_user
      TZ: Asia/Shanghai
    volumes:
      - /opt/jxwaf_data/ssl_cert_service:/data

  jxwaf_nft_node:
    image: ccr.ccs.tencentyun.com/jxwaf/jxwaf_nft_node:7.0
    container_name: jxwaf_nft_node
    restart: always
    network_mode: host
    privileged: true
    environment:
      WAF_SERVER_URL: http://127.0.0.1:8000
      WAF_AUTH: ade1e4c0-d644-46fe-9675-5fb59b486381
      SYNC_INTERVAL: 3
      TZ: Asia/Shanghai
      WAF_FILTER_PORTS: "80,443"

  jxwaf_model_server:
    image: ccr.ccs.tencentyun.com/jxwaf/jxwaf_model_server:2.7
    container_name: jxwaf_model_server
    restart: unless-stopped
    depends_on:
      - mysql_model_db
    network_mode: host
    ulimits:
      nofile:
        soft: 602400
        hard: 602400
    environment:
      # ==================== 基础配置 ====================
      TZ: Asia/Shanghai
      MODEL_SERVER_SECRET: jxwaf                            # 与控制台约定的 HMAC-SHA1 共享密钥（生产建议同步更换强密钥）
      STREAM_HOST: 0.0.0.0                                  # 监听地址（默认 127.0.0.1，host 网络需 0.0.0.0）
      STREAM_PORT: "39980"
      ENABLE_TLS: "false"                                   # 公网部署必须 "true" 并挂载下方证书
      TLS_CERT: /opt/jxwaf_model_server/conf/server.crt
      TLS_KEY: /opt/jxwaf_model_server/conf/server.key
      MAX_CONNS_PER_IP: "64"                                # 单 IP 最大并发连接数（0 = 不限制）
      CACHE_CAPACITY: "1000000"                             # 查询结果 LRU 缓存条目数（满容量约 1GB 内存，按需下调）

      # ==================== MySQL 数据库配置 ====================
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3307"                                    # 独立 MySQL 实例的宿主机映射端口
      MYSQL_USER: root
      MYSQL_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739
      MYSQL_DATABASE: jxwaf_model_server
      DB_MAX_OPEN_CONNS: "100"
      DB_MAX_IDLE_CONNS: "100"
      DB_CONN_MAX_LIFETIME_SECONDS: "1800"

      # ==================== 分析调度配置 ====================
      SCAN_INTERVAL: "3"                                    # initial worker 扫描周期（秒）
      RETRY_INTERVAL_SECONDS: "300"                         # 状态 3（可疑）记录重查周期（秒）
      RETRY_MAX_ATTEMPTS: "2"
      RETRY_QPS: "2"
      RETRY_BACKOFF_MS: "500"                               # 单次分析内重试退避起始（毫秒）
      RETRY_MAX_BACKOFF_MS: "30000"

      # ==================== 历史记录重扫（Rescan） ====================
      # 独立低优先级 worker，按 id 扫描历史记录，弥补 initial 游标只前进不回卷的问题
      RESCAN_INTERVAL_SECONDS: "86400"                      # 重扫周期（秒），默认一天一次；0 = 关闭
      RESCAN_SCOPE: pending                                 # pending = 只重扫 res=0；rejected = 重扫 res=0/5（会覆盖 5）
      RESCAN_QPS: "2"                                       # 重扫每秒请求上限（独立于 analyzer qps）
      RESCAN_CONCURRENCY: "2"                               # 重扫并发
      RESCAN_MIN_AGE_SECONDS: "3600"                        # 只重扫创建超过该秒数的 res=0（避免与 initial 处理新记录重叠）；0=不限制

      # ==================== 输入限制配置 ====================
      MAX_AI_INPUT_BYTES: "262144"                          # 送 AI 的输入上限（字节，默认 256KB）
      OVERSIZE_POLICY: truncate
      MAX_LINE_SIZE: "2097152"                              # 协议单行上限（字节，默认 2MB）
      MAX_RAW_STRING_SIZE: "262144"                         # raw_string 落库上限（字节）
      RAW_STRING_STORAGE: db                                # db（默认，raw 落库）/ memory（raw 只放内存，不落库）
      RAW_MEMORY_TTL_SECONDS: "1800"                        # memory 模式 raw 内存保留时间（秒）
      RAW_MEMORY_MAX_MB: "1024"                             # memory 模式 raw 内存上限（MB，非预分配）
      RAW_MEMORY_MAX_ITEMS: "200000"                        # memory 模式 raw 条目上限
      RAW_MEMORY_SKIP_SECONDS: "1800"                       # raw 未命中时 worker 跳过该记录的时长（秒）；查询带回 raw 会立即清除跳过标记

      # ==================== 熔断配置 ====================
      CIRCUIT_COOLDOWN_SECONDS: "60"                        # 熔断初始冷却（秒）
      CIRCUIT_MAX_COOLDOWN_SECONDS: "3600"                  # 冷却上限（连续熔断翻倍递增）
      CIRCUIT_FAILURE_THRESHOLD: "5"
      CIRCUIT_FAILURE_WINDOW_SECONDS: "30"
      CIRCUIT_MIN_REQUESTS: "10"                            # 熔断生效所需最小样本数
      CIRCUIT_HALF_OPEN_PROBES: "2"

      # ==================== 协议与同步配置 ====================
      SYNC_BATCH_SIZE: "1000"                               # 同步接口单批返回条数
      READ_TIMEOUT_SECONDS: "30"
      WRITE_TIMEOUT_SECONDS: "30"
      SHUTDOWN_TIMEOUT_SECONDS: "120"

      # ==================== AI 平台配置 ====================
      # 必填：api_key、model；api_key 部署前必须替换为真实值，model 需对照平台可用模型名核对
      # column 不配置时自动生成 res_<平台名小写>；fallback_column 可选备用读取列
      # backfill 可选（不配置 = 新记录由 initial worker 兜底分析）：
      #   {"mode": "last"} 查询命中未分析记录时即时分析 / {"mode": "full"} 全量回填存量 / {"mode": "window", "window_days": 7} 回填最近 N 天
      PLATFORMS: |-
        {
            "deepseek": {
                "api_key": "sk-xxx",
                "api_url": "https://api.deepseek.com/chat/completions",
                "model": "deepseek-flash",
                "temperature": 0.2,
                "timeout": 120,
                "max_retries": 2,
                "analysis_count": 3,
                "analysis_consistency_retries": 2,
                "thinking_type": "disabled",
                "stream": false,
                "concurrency": 20,
                "qps": 10,
                "column": "res_deepseek",
                "fallback_column": ""
            }
        }

      # ==================== WAF 引擎配置 ====================
      # 必填：url、match_type（status_code/content_contains）、match_value
      # method 未配置默认 POST，payload_location 默认 body；upload_replay 开启后 multipart 请求体原样回放
      # refresh 定期重查已检出记录（interval_hours 0 = 不启动）
      WAF_ENGINES: |-
        {
            "safeline": {
                "url": "http://waf-safeline.jxwaf.com/hello.html",
                "timeout": 5,
                "match_type": "status_code",
                "match_value": 403,
                "concurrency": 20,
                "qps": 10,
                "upload_replay": true,
                "column": "res_safeline",
                "refresh": {
                    "interval_hours": 24,
                    "scope": "recent",
                    "recent_days": 7,
                    "qps": 10
                }
            }
        }
    #volumes:
      #- ./ssl/server.crt:/opt/jxwaf_model_server/conf/server.crt:ro
      #- ./ssl/server.key:/opt/jxwaf_model_server/conf/server.key:ro

  mysql_model_db:
    image: ccr.ccs.tencentyun.com/jxwaf/mysql:8.0
    container_name: jxwaf_model_server_mysql
    restart: always
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_0900_ai_ci
      MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb_buffer_pool_size=256M
      - --max-connections=1000
    volumes:
      - /opt/jxwaf_data/mysql_model_server:/var/lib/mysql

  #     MAX_CONNS_PER_IP: "64"                                      # 单 IP 最大并发连接数（0 = 不限制）
  #     CACHE_CAPACITY: "1000000"                                   # 查询结果 LRU 缓存最大条目数（满容量约 1GB 内存）
  #     MYSQL_HOST: 127.0.0.1                                       # MySQL 主机地址

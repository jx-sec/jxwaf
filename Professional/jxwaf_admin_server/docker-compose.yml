services:
  # MySQL 8.0 数据库
  mysql_db:
    image: ccr.ccs.tencentyun.com/jxwaf/mysql:8.0
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739  # 建议生产环境修改
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_0900_ai_ci
      MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb_buffer_pool_size=256M
    volumes:
      - /opt/jxwaf_data/professional_mysql:/var/lib/mysql

  # JXWAF 控制台
  jxwaf_admin_server:
    image: ccr.ccs.tencentyun.com/jxwaf/jxwaf_admin_server_professional:6.2.17
    restart: unless-stopped
    depends_on:
      - mysql_db
    network_mode: host                              # 使用宿主机网络
    environment:
      ENABLE_HTTPS: false
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: jxwaf_admin_server
      MYSQL_USER: root
      MYSQL_PASSWORD: 958fba75-56c6-4e81-a892-62517a9e1739
      HTTP_PORT: 80
      #HTTPS_PORT: 443
      JXWAF_MODEL_SERVER_HOST: model.jxwaf.com      # AI 模型服务器地址
      JXWAF_MODEL_SERVER_PORT: 39980
      JXWAF_MODEL_SERVER_SSL: true
      WAF_UPDATE_CONF_DATA_SIZE: "100m"
      CONF_DATA_SIZE: "100m"
      MODEL_DATA_SIZE: "100m"
      OPEN_REGIST: "false"
      TZ: Asia/Shanghai
    # 如需启用 HTTPS，取消下面注释并放置证书文件
    #volumes:
    #  - ./ssl_certs/server.crt:/opt/jxwaf_admin_server/nginx/conf/server.crt
    #  - ./ssl_certs/server.key:/opt/jxwaf_admin_server/nginx/conf/server.key

  # ==================== SSL 证书自动申请服务（Let's Encrypt 泛域名证书，配合管理台证书管理功能）====================
  # 注意：依赖管理台镜像包含证书管理功能（/request_wildcard_cert 及内部 API），上线前需确认管理台镜像版本已更新
  # 管理台 HTTP_PORT 为 80，回调地址相应使用 80 端口
  ssl_cert_service:
    image: ccr.ccs.tencentyun.com/jxwaf/ssl_cert_service:6.2.3
    container_name: ssl_cert_service
    restart: always
    depends_on:
      - jxwaf_admin_server
    network_mode: host
    environment:
      CONSOLE_API_URL: http://127.0.0.1:80
      POLL_INTERVAL: 60s
      RENEWAL_CHECK_INTERVAL: 6h
      RENEWAL_DAYS: 30
      ACME_DIRECTORY_URL: https://acme-v02.api.letsencrypt.org/directory
      ACME_ACCOUNT_DIR: /data/acme_accounts
      ACME_EMAIL_DOMAIN: jxwaf.com
      ACME_ACCOUNT_MODE: per_user
      TZ: Asia/Shanghai
    volumes:
      # ACME 账户持久化，避免容器重建后重复注册账号（Let's Encrypt 有每账号速率限制）
      - /opt/jxwaf_data/ssl_cert_service:/data

  # ==================== AI 模型分析服务（可选，自建时取消注释启用） ====================

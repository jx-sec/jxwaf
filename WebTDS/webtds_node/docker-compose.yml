services:
  wtds:
    image: "ccr.ccs.tencentyun.com/jxwaf/wtds_authorizatio:2.5"
    container_name: wtds
    network_mode: host
    ulimits:
      nofile:
        soft: 602400
        hard: 602400
    environment:
      WTDS_SERVER: you_wtds_server
      WTDS_AUTH: you_auth_key
      CONF_DATA: 100m
      INNER_DICT: 100m
      GLOBAL_DICT: 100m
      USER_DATA: 100m
      SUPPRESS: 100m
      #EXTRA_SHARED_DICTS: "node_data:100m"
      TZ: Asia/Shanghai
    restart: unless-stopped

  tcp-forwarder:
    image: ccr.ccs.tencentyun.com/jxwaf/tcp-forwarder:v1
    container_name: tcp-forwarder
    environment:
      LISTEN_ADDR: 0.0.0.0:9988
      TARGET_ADDR: 127.0.0.1:9977
      TZ: Asia/Shanghai
    network_mode: host
    restart: unless-stopped

  # 日志转发服务：接收本机 webtds 推送的日志并批量写入阿里云 SLS
  # 启用前必读：
  #   1. SLS_ACCESS_KEY_ID / SLS_ACCESS_KEY_SECRET 必须填写，为空时程序启动即 fatal 退出，
  #      配合 restart: unless-stopped 会无限重启（校验逻辑见 main.go 的 main 函数）
  #   2. SLS_ENDPOINT 不带协议头时 SDK 走明文 HTTP（80 端口），内网环境无需 TLS，性能更好
  #   3. LISTEN_ADDR 为 host 网络下监听所有网卡的 6666 端口，会覆盖代码默认的 :49977，
  #      需与 webtds 的日志推送地址保持一致；若 webtds 在本机，可改为 127.0.0.1:6666 更安全
  # log_send_to_sls:
  #   image: ccr.ccs.tencentyun.com/jxwaf/log_send_to_sls:v2
  #   container_name: log-send-to-sls
  #   network_mode: host
  #   environment:
  #     LISTEN_ADDR: :6666            # 覆盖代码默认值 :49977，需与 webtds 推送日志的地址一致
  #     BATCH_SIZE: 50                # 攒够 50 条立即发送
  #     BATCH_WAIT_TIMEOUT: 1s        # 不足 50 条时最多等 1s
  #     MAX_CONNECTIONS: 100000       # 最大并发连接数
  #     RATE_LIMIT: 0                 # 0 = 不限流（代码仅在 >0 时启用限流）
  #     MAX_LINE_SIZE: 10485760       # 单行最大 10MB，与代码默认值一致
  #     SLS_ENDPOINT: cn-hangzhou-intranet.log.aliyuncs.com  # 内网 endpoint，不带 https:// 走 HTTP 性能更好
  #     SLS_ACCESS_KEY_ID:            # 必填，否则启动失败
  #     SLS_ACCESS_KEY_SECRET:        # 必填，否则启动失败
  #     SLS_PROJECT: cn-webids
  #     SLS_LOGSTORE: cn-webidslog
  #     TZ: Asia/Shanghai             # 仅透传时区，不影响 SLS 时间戳（使用 Unix 时间）
  #   restart: unless-stopped
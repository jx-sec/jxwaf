networks:
  clickhouse_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.60.0.0/24

services:
  clickhouse:
    container_name: wtds_clickhouse
    image: "ccr.ccs.tencentyun.com/jxwaf/clickhouse-server:22.8.5-alpine"
    ports:
      - "9000:9000"
      - "9004:9004"
    environment:
      TZ: Asia/Shanghai
      CLICKHOUSE_DB: wtds
      CLICKHOUSE_USER: jxlog
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: jxlog
    volumes:
      - /opt/wtds_data/clickhouse:/var/lib/clickhouse
    restart: unless-stopped
    networks:
      clickhouse_network:
        ipv4_address: 172.60.0.10
  wtds_log:
    container_name: wtds_log
    image: "ccr.ccs.tencentyun.com/jxwaf/wtds_log:2.2"
    ports:
      - "8866:8866"
    # 日志字段新增/变更后需重启本容器，启动后首批数据会重新检测一次表结构
    environment:
      TZ: Asia/Shanghai
      CLICKHOUSE: 172.60.0.10:9000
      DATABASE: wtds
      USERNAME: jxlog
      PASSWORD: jxlog
      TABLE: wtds_log
      TCPSERVER: 0.0.0.0
      TCPPORT: 8866
      TTL_DAYS: 30      # 数据保留天数，0 表示永久保留（仅建表时生效）
      BATCH_SIZE: 100   # 批量写入条数
      FLUSH_MS: 1000    # 批量刷新间隔(毫秒)
    depends_on:
      - clickhouse
    restart: unless-stopped
    networks:
      clickhouse_network:
        ipv4_address: 172.60.0.11
services:
  jxwaf_user_console:
    image: ccr.ccs.tencentyun.com/jxwaf/jxwaf_user_console:1.0
    restart: unless-stopped
    network_mode: host
    environment:
      # Cloud 主控台 API 地址（必填）
      CLOUD_API_URL: "http://127.0.0.1:80"
      # Cloud 主控台分配的 API_KEY，即主账号的 waf_auth（必填）
      CLOUD_API_KEY: ""
      # 默认接入配置名称（必填，注册子账号时自动绑定，需与主账号在 Cloud 控制台创建的接入配置名一致）
      DEFAULT_WEBSITE_ACCESS_CONF: ""
      # HTTP 监听端口
      HTTP_PORT: "8080"
      TZ: Asia/Shanghai
